<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span id="header-title">Internet Hub</span>
        <div id="header-stats">
            <div class="header-stat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M12 20h.01"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a9 9 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/>
                </svg>
                <span id="ov-ssid">-</span>
            </div>
            <div class="header-stat-sep"></div>
            <div class="header-stat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"/><path d="M5 12l7 7 7-7"/>
                </svg>
                <span id="ov-download">-</span>
            </div>
            <div class="header-stat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
                </svg>
                <span id="ov-upload">-</span>
            </div>
            <div class="header-stat-sep"></div>
            <div class="header-stat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l8 4v5c0 5.25-3.5 8.5-8 9.5-4.5-1-8-4.25-8-9.5V7l8-4z"/>
                </svg>
                <span id="ov-vpn-status" class="status-inactive">No VPN</span>
            </div>
        </div>
    </header>
    <main>
        <div id="left-Container">
            <div id="lC-IPinformation">
                <h3>IP Information</h3>
                <div class="info-row">
                    <span class="label">IPv4: </span>
                    <span id="in-ip4">-</span>
                </div>
                <div class="info-row">
                    <span class="label">IPv6: </span>
                    <span id="in-ip6">-</span>
                </div>
                <div class="info-row">
                    <span class="label">IPv4 Subnet: </span>
                    <span id="in-ip4-subnet">-</span>
                </div>
                <div class="info-row">
                    <span class="label">IPv6 Subnet: </span>
                    <span id="in-ip6-subnet">-</span>
                </div>
                <div class="info-row">
                    <span class="label">MAC Address: </span>
                    <span id="in-mac">-</span>
                </div>
                <div class="info-row">
                    <span class="label">Default Gateway: </span>
                    <span id="in-default-gateway">-</span>
                </div>
                <div class="info-row">
                    <span class="label">DNS: </span>
                    <span id="in-dns">-</span>
                </div>
                <div class="info-row">
                    <span class="label">DHCP: </span>
                    <span id="in-dhcp">-</span>
                </div>
            </div>
            <div id="lC-vpnContainer">
                <h3>VPN</h3>
                <div class="btn-row">
                    <button class="btn-connect" id="vpnConnectBtn"><span>Connect</span><i></i></button>
                    <button class="btn-disconnect" id="vpnDisconnectBtn"><span>Disconnect</span><i></i></button>
                    <select id="vpn-country">
                        <option value="canada1">Canada</option>
                        <option value="uk1">United Kingdom</option>
                        <option value="us1">United States</option>
                    </select>
                </div>
            </div>
            <div id="lC-settingsContainer">
                <h3>Wi-Fi</h3>
                <div class="btn-row">
                    <button class="btn-connect" id="wifiConnectBtn"><span>Connect</span><i></i></button>
                    <button class="btn-disconnect" id="wifiDisconnectBtn"><span>Disconnect</span><i></i></button>
                    <button class="btn-action" id="wifiRefreshBtn"><span>Refresh</span><i></i></button>
                </div>
                <select id="wifi-networks">
                    <option value="network1">Network 1</option>
                    <option value="network2">Network 2</option>
                    <option value="network3">Network 3</option>
                </select>
            </div>
        </div>
        <div id="right-Container">
            <div id="rC-topbar">
                <div id="rC-reloadBtn" class="rC-topbarBtn">
                    <button id="scannNetwork">Scann</button>
                </div>
                <div id="rC-downloadBtn" class="rC-topbarBtn">
                    <button id="downloadBtn">Download</button>
                </div>
            </div>
            <div id="rC-mapContainer">
                <div id="scanLoader">
                    <div class="loader">
                        <span></span>
                    </div>
                </div>
            </div>
            <div id="rC-terminalContainer"></div>
        </div>
    </main>
    
    <footer>Footer</footer>
    <div id="wlanLoginOverlay">
        <div class="glitch-form-wrapper">
            <form class="glitch-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 18l.01 0"/>
                            <path d="M9.172 15.172a4 4 0 0 1 5.656 0"/>
                            <path d="M6.343 12.343a8 8 0 0 1 11.314 0"/>
                            <path d="M3.515 9.515a12 12 0 0 1 16.97 0"/>
                        </svg>
                        <span>WIFI_AUTH</span>
                    </div>
                    <div class="card-dots"><span></span><span></span><span></span></div>
                </div>

                <div class="card-body">
                    <div class="form-group">
                        <div class="ssid-display" id="wlanSsidDisplay">—</div>
                        <label class="form-label ssid-label" data-text="NETWORK">NETWORK</label>
                    </div>

                    <div class="form-group">
                        <input type="password" id="wlanPasswordInput" name="password" required placeholder="" />
                        <label for="wlanPasswordInput" class="form-label" data-text="ACCESS_KEY">ACCESS_KEY</label>
                    </div>

                    <button data-text="CONNECT" type="button" class="submit-btn" id="wlanLoginBtn">
                        <span class="btn-text">CONNECT</span>
                    </button>
                    <button type="button" class="cancel-btn" id="wlanCancelBtn">CANCEL</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script type="module" src="diagram.js"></script>
<script src="app.js" type="module"></script>
</html>
